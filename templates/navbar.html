<!-- base.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-2">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-semibold d-flex align-items-center" href="{% url 'blog-home' %}">
      <i class="fas fa-home me-2"></i> StudyHub
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

      <!-- Search form -->
      <form id="searchform" action="{% url 'search' %}" method="get"
            class="d-flex mx-auto my-2 my-lg-0" style="max-width: 280px;">
        <div class="input-group input-group-sm">
          <input type="text" name="q" value="{{ request.GET.q }}" class="form-control bg-dark text-light border-secondary"
                 placeholder="Search..." aria-label="Search">
          <button class="btn btn-outline-light" type="submit">
            <i class="fa fa-search"></i>
          </button>
        </div>
      </form>

      <!-- Right side buttons -->
      <div class="d-flex align-items-center mt-2 mt-lg-0">

        <a href="{% url 'filter-posts' %}" class="btn btn-sm btn-outline-light me-2">
          <i class="fa fa-filter"></i> <span class="d-none d-lg-inline">Filter</span>
        </a>

        {% if user.is_authenticated %}
          <a href="{% url 'user-posts' user %}" class="btn btn-sm btn-outline-light me-2">
            <i class="fas fa-user-shield"></i> <span class="d-none d-lg-inline">My Posts</span>
          </a>
          <a href="{% url 'post-create' %}" class="btn btn-sm btn-outline-light me-2">
            <i class="fas fa-plus-circle"></i> <span class="d-none d-lg-inline">New</span>
          </a>
          <a href="{% url 'profile' %}" class="btn btn-sm btn-outline-light me-2">
            <i class="fas fa-user"></i> <span class="d-none d-lg-inline">{{ user.username }}</span>
          </a>
          <form method="POST" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-danger">
              <i class="fas fa-sign-out-alt"></i> <span class="d-none d-lg-inline">Logout</span>
            </button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light me-2">
            <i class="fas fa-user-tie"></i> <span class="d-none d-lg-inline">Login</span>
          </a>
          <a href="{% url 'register' %}" class="btn btn-sm btn-light text-dark">
            <i class="fas fa-sign-in-alt"></i> <span class="d-none d-lg-inline">Sign Up</span>
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
