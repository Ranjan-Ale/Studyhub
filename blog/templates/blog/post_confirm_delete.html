{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'blog/css/post_confirm_delete.css' %} ">
{% endblock extra_css %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg border-0 rounded-4 p-4 w-100" style="max-width: 550px;">
    <div class="card-body text-center">
      <div class="mb-4">
        <i class="fas fa-exclamation-triangle text-danger fa-3x mb-3"></i>
        <h3 class="fw-bold text-dark">Delete Post</h3>
        <hr class="my-3">
        <p class="text-muted">
          Are you sure you want to permanently delete the post
          <strong class="text-dark">"{{ object.title }}"</strong>?  
          <br>This action cannot be undone.
        </p>
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center flex-wrap gap-3">
          <button type="submit" class="btn btn-danger px-4">
            <i class="fas fa-trash-alt me-2"></i> Yes, Delete
          </button>
          <a href="{% url 'post-detail' object.id %}" class="btn btn-outline-secondary px-4">
            <i class="fas fa-times me-2"></i> Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>


{% endblock content %}
