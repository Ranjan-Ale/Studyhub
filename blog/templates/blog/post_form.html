{% extends "base.html" %}
{% load static %}

{% load crispy_forms_tags %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'blog/css/post_form.css' %}">
{% endblock extra_css %}    

{% block content %}
<div class="container my-5">
  <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 700px; margin: auto;">
    <div class="card-body">

      <!-- Header -->
      <div class="text-center mb-4">
        <i class="fas fa-upload text-primary fa-2x mb-2"></i>
        <h3 class="fw-bold text-dark">Create a Post</h3>
        <p class="text-muted small">Share your study materials or notes with others.</p>
        <hr>
      </div>

      <!-- Form -->
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset class="form-group mb-4">
          {{ form|crispy }}
        </fieldset>

        <!-- Buttons -->
        <div class="d-flex justify-content-center gap-3">
          <button type="submit" class="btn btn-primary px-4">
            <i class="fas fa-paper-plane me-2"></i> Publish
          </button>
          <a href="{% url 'blog-home' %}" class="btn btn-outline-secondary px-4">
            <i class="fas fa-times me-2"></i> Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>


{% endblock content %}
