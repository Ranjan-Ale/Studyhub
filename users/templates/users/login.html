{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-body-tertiary">
  <div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 380px; width: 100%;">
    <div class="text-center mb-4">
      <h3 class="fw-semibold mb-1">Welcome Back</h3>
      <p class="text-secondary small mb-0">Log in to your account</p>
    </div>

    <form method="POST" class="needs-validation" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-grid mt-3">
        <button class="btn btn-primary btn-lg fw-semibold shadow-sm" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </button>
      </div>
    </form>

    <div class="text-center mt-4">
      <small class="text-muted">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-decoration-none fw-semibold link-primary">
          Sign Up
        </a>
      </small>
    </div>
  </div>
</div>

<!-- Optional Bootstrap interactivity: smooth hover & transitions -->
<style>
  body {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  }
  .card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.08);
  }
  .btn-primary {
    background-color: #0d6efd;
    border: none;
    transition: background-color 0.2s ease;
  }
  .btn-primary:hover {
    background-color: #0b5ed7;
  }
</style>
{% endblock content %}
