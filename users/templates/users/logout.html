{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-body-tertiary">
  <div class="card border-0 shadow-sm p-5 rounded-4 text-center" style="max-width: 380px; width: 100%;">
    <div class="mb-4">
      <div class="mb-3">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
      </div>
      <h3 class="fw-semibold text-success mb-1">You’ve been logged out</h3>
      <p class="text-secondary small mb-0">Hope to see you back soon!</p>
    </div>
    <div class="d-grid mt-4">
      <a href="{% url 'login' %}" class="btn btn-primary btn-lg fw-semibold shadow-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Log In Again
      </a>
    </div>
  </div>
</div>

<!-- Minimal hover and visual interaction -->
<style>
  body {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  }
  .card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0.75rem 1.25rem rgba(0, 0, 0, 0.08);
  }
  .btn-primary {
    background-color: #0d6efd;
    border: none;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }
  .btn-primary:hover {
    background-color: #0b5ed7;
    transform: translateY(-1px);
  }
</style>
{% endblock content %}
