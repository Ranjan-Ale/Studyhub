{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="d-flex justify-content-center align-items-center min-vh-100 bg-body-tertiary">
  <div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <h2 class="fw-semibold mb-1">Join Today</h2>
      <p class="text-secondary small">Create your account and start learning!</p>
    </div>

    <form method="POST" class="needs-validation" novalidate>
      {% csrf_token %}
      <fieldset class="form-group">
        {{ form|crispy }}
      </fieldset>

      <div class="d-grid mt-3">
        <button class="btn btn-primary btn-lg fw-semibold transition-all" type="submit">
          Sign Up
        </button>
      </div>
    </form>

    <div class="text-center mt-4">
      <small class="text-muted">
        Already have an account?
        <a href="{% url 'login' %}" class="text-decoration-none link-primary fw-semibold hover-underline">
          Sign In
        </a>
      </small>
    </div>
  </div>
</div>

<!-- Minimal interactive effects -->
<style>
  body {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
  }

  .btn-primary {
    background-color: #0d6efd;
    border: none;
    transition: all 0.25s ease-in-out;
  }
  .btn-primary:hover {
    background-color: #0b5ed7;
    transform: translateY(-1px);
  }

  .card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.08);
  }

  .hover-underline:hover {
    text-decoration: underline;
  }
</style>

{% endblock content %}
